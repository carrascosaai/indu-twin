services:
  - type: web
    name: indu-twin-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Sin esto, Render redespliega (y por tanto resetea la base de datos
    # efimera, incluidas las contraseñas) con CUALQUIER push al repo,
    # aunque el cambio sea solo del frontend.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PLAN
        value: business
      # Ajusta estos dos con la URL real de Vercel una vez la tengas
      # (Render > tu servicio > Environment). CORS_ORIGINS acepta varias
      # separadas por coma si necesitas más de un dominio.
      - key: CORS_ORIGINS
        value: https://indu-twin.vercel.app
      - key: APP_BASE_URL
        value: https://indu-twin.vercel.app
      # Opcional: activa notificaciones por email de alertas criticas y el
      # envio de informes automaticos. Si se deja vacio, esas funciones se
      # desactivan solas sin romper nada.
      - key: SMTP_HOST
        value: ""
      # Base de datos persistente (ver seccion "databases" mas abajo). Sin
      # esto, el backend usaria SQLite en el disco efimero del contenedor,
      # que se borra en cada redeploy - inaceptable en cuanto haya sensores
      # reales mandando datos.
      - key: DATABASE_URL
        fromDatabase:
          name: indu-twin-db
          property: connectionString

databases:
  - name: indu-twin-db
    databaseName: indutwin
    user: indutwin
    plan: free
    # Aviso: el plan free de Postgres en Render caduca pasado un tiempo
    # (revisa el aviso exacto en el dashboard al crearla - la politica de
    # Render cambia de vez en cuando). Para datos de produccion reales sin
    # fecha de caducidad hace falta el plan de pago (unos 6-7 USD/mes).
