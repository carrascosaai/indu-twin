[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "B008",  # Depends(...) en valores por defecto es el patron estandar de FastAPI
]

[tool.ruff.lint.per-file-ignores]
"seed.py" = ["E501"]  # tablas de datos demo, mas legibles en una sola linea
